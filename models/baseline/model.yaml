# YOLO26-seg with BiFPN Neck
# Model docs: https://docs.ultralytics.com/models/yolo26

# Parameters
nc: 80 # number of classes
end2end: True
reg_max: 1
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO26n backbone
backbone:
  - [-1, 1, Conv, [64, 3, 2]]        # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]       # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]       # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]       # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]      # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]]           # 10

# YOLO26n head with BiFPN
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]     # 11
  - [[-1, 6], 1, BiFPN_Concat, [512, 2]]           # 12  P4 融合
  - [-1, 2, C3k2, [512, True]]                      # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]     # 14
  - [[-1, 4], 1, BiFPN_Concat, [256, 2]]           # 15  P3 融合
  - [-1, 2, C3k2, [256, True]]                      # 16 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]                      # 17
  - [[-1, 13], 1, BiFPN_Concat, [512, 2]]          # 18  P4 融合（下）
  - [-1, 2, C3k2, [512, True]]                      # 19 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]                      # 20
  - [[-1, 10], 1, BiFPN_Concat, [1024, 2]]         # 21  P5 融合（下）
  - [-1, 1, C3k2, [1024, True, 0.5, True]]         # 22 (P5/32-large)

  - [[16, 19, 22], 1, Segment26, [nc, 32, 256]]    # Segment26(P3, P4, P5)
